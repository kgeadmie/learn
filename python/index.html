<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>"and its a stick!"</title>
    <script src="./mini-coi-fd.js"></script>
    <script type="module" src="./pyscript/core.js" offline></script>
    <link rel="stylesheet" href="./pyscript/core.css">
    <style>
        body{
            margin:0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }
        #pyscript_terminal {
            flex-grow: 1;
            width: 100%;
        }
    </style>
</head>
<body>
    <script type="py" terminal worker>
        import code, asyncio, os
        from pyscript import fs
        
        await fs.mount('/fs-con', mode='readwrite')
        
        async def _sync(*args):
            fs.sync('/fs-con')
        def sync():
            asyncio.run(_sync())

        os.chdir('/fs-con')
        print(os.getcwd())
        code.interact()
    </script>
</body>
