<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>"and its a stick!"</title>
    <script src="./mini-coi-fd.js"></script>
    <script type="module" src="./pyscript/core.js" offline></script>
    <link rel="stylesheet" href="./pyscript/core.css">
    <style>
        body {
            background-color: black;
        }
        #pyscript_terminal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <script type="py" terminal worker>
        import code, asyncio, os
        from pyscript import fs, window, ffi
        
        _terminal = __terminal__ # type: ignore

        def _resize_terminal(event=None):
            if '__terminal__' in locals() or '__terminal__' in globals():
                width = window.innerWidth
                height = window.innerHeight
                cols = int(width / 10)
                rows = int(height / 20)
                
                _terminal.resize(cols, rows)
        
        _resize_terminal()
        window.addEventListener("resize", ffi.create_proxy(_resize_terminal))
        
        class shutil:
            def get_terminal_size():
                return _terminal.cols, _terminal.rows
        
        print(shutil.get_terminal_size())
        
        await fs.mount('/fs-con', mode='readwrite')
        
        async def _sync(*args):
            fs.sync('/fs-con')
        def sync():
            asyncio.run(_sync())

        os.chdir('/fs-con')
        print(os.getcwd())
        code.interact(local={**globals(), **locals()})
    </script>
</body>
</html>
